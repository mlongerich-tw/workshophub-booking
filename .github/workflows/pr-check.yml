name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so reasons-lint can find the merge base with origin/main.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenCode parity check
        run: node scripts/sync-opencode.mjs --check

      # Lints the canvases in the PR merge commit (what will land), using the PR
      # branch name for the "story source changes need a canvas" rule. Catches
      # commits and pushes made with --no-verify. The branch name is passed via
      # env and quoted, never interpolated into the script or a make variable.
      - name: REASONS canvas lint
        run: bash scripts/reasons-lint.sh --rev HEAD --branch "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

      - name: Generate Prisma client
        run: cd api && pnpm exec prisma generate

      - name: Push database schema (test DB)
        run: cd api && pnpm exec prisma db push
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite

      - name: Seed database
        run: cd api && pnpm exec prisma db seed
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite

      - name: Run tests
        run: pnpm run test
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite
          # Note: DATABASE_URL is relative to api/prisma/schema.prisma
          # file:../database/X resolves to api/database/X

      - name: Run lint
        run: pnpm run lint

      - name: Run format check
        run: pnpm run format-check

